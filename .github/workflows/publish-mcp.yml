name: Publish to MCP Registry

# The listing is io.github.Blue-Gamma/bluegamma. A personal `mcp-publisher login
# github` can't publish under an org namespace; GitHub OIDC from a Blue-Gamma repo
# can, with no stored secret. Bump "version" in server.json for each publish: the
# registry refuses a version it already has.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [server.json]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login to the registry
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.5/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
